<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>791 Barber | Experience Excellence</title>

  <!-- Meta Tags para iPhone/PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    (function () {
      try {
        const url = new URL(window.location.href);
        const pathParts = url.pathname.split('/').filter(Boolean);
        const slug = pathParts[0];
        const clientId = url.searchParams.get('c') || url.searchParams.get('clientId');

        if (slug && slug !== 'debug-push' && slug !== 'index.html' && slug !== 'favicon.ico') {
          // 1. Salva contexto para o app
          localStorage.setItem('791_last_slug', slug);
          if (clientId) localStorage.setItem('791_last_client_id', clientId);

          // 2. Injeta Manifest Dinâmico
          const manifestUrl = 'https://api.791barber.com/api/public/manifest/' + slug + (clientId ? '?c=' + clientId : '');
          const link = document.createElement('link');
          link.rel = 'manifest';
          link.href = manifestUrl;
          document.head.appendChild(link);

          // 3. Tenta forçar o título para o Safari (pode ajudar no diálogo de share)
          // Nota: O App.tsx atualizará isso com o nome real do banco depois.
          const meta = document.createElement('meta');
          meta.name = 'apple-mobile-web-app-title';
          meta.content = slug.charAt(0).toUpperCase() + slug.slice(1);
          document.head.appendChild(meta);
        } else {
          // Fallback se não houver slug
          const link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/manifest.json';
          document.head.appendChild(link);
        }
      } catch (e) {
        console.error('Metadata injection error', e);
      }
    })();
  </script>
  <script>
    // --- NUCLEAR DEBUGGER ---
    // Injetado para capturar erros que ocorrem ANTES do React montar (ex: sintaxe, loading chunks)
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      const container = document.createElement('div');
      container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:#ff5555;z-index:99999;padding:20px;font-family:monospace;white-space:pre-wrap;overflow:auto;pointer-events:all;box-sizing:border-box;border:2px solid red;';
      
      const title = document.createElement('h1');
      title.textContent = 'ERRO CRÍTICO (Global Handler)';
      title.style.color = 'white';
      
      const text = document.createElement('div');
      text.textContent = [
        'Mensagem: ' + msg,
        'URL: ' + url,
        'Linha: ' + lineNo,
        'Coluna: ' + columnNo,
        'Stack: ' + (error?.stack || 'N/A')
      ].join('\n\n');

      container.appendChild(title);
      container.appendChild(text);

      const btn = document.createElement('button');
      btn.textContent = 'LIMPAR CACHE E RECARREGAR';
      btn.style.cssText = 'margin-top:20px;padding:15px;background:red;color:white;border:none;border-radius:8px;font-weight:bold;font-size:14px;';
      btn.onclick = function() {
        localStorage.clear();
        if ('caches' in window) {
           caches.keys().then(function(names) {
             for (let name of names) caches.delete(name);
             window.location.reload(true);
           });
        } else {
           window.location.reload(true);
        }
      };
      container.appendChild(btn);

      document.body.appendChild(container);
      return false;
    };

    window.onunhandledrejection = function (event) {
      window.onerror('Unhandled Rejection: ' + (event.reason?.message || event.reason), 'Promise', 0, 0, event.reason);
    };
  </script>

  <!-- Ícone Padrão (Fallback) -->
  <link id="favicon" rel="icon" type="image/png" href="/icon-192.png" />
  <link id="apple-icon" rel="apple-touch-icon" href="/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
